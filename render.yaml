services:
  - type: web
    name: aapla-dada-portal
    runtime: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: dada@123
      - key: FIREBASE_CREDENTIALS_JSON
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: sagareparth@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        value: sagareparth@gmail.com
      - key: SMTP_FROM_NAME
        value: "आपला दादा जनसंपर्क कक्ष (विटा-खानापूर)"
      - key: OFFICE_NOTIFICATION_EMAIL
        value: sagareparth@gmail.com
